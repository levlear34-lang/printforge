<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your model is ready — Objexa</title>
<meta name="description" content="Download your validated, print-ready STL file.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<nav class="nav">
  <div class="container">
    <a class="nav-logo" href="/">Obj<span>exa</span></a>
    <div class="nav-links">
      <a href="/create" class="btn btn-primary">Create another</a>
    </div>
  </div>
</nav>

<main>
  <section class="section">
    <div class="container">
      <div id="content">
        <p style="text-align:center; color: var(--text-muted)">Loading…</p>
      </div>
    </div>
  </section>
</main>

<script src="/assets/app.js"></script>
<script>
const jobId = qs("id");
const content = document.getElementById("content");

async function load() {
  if (!jobId) {
    content.innerHTML = `<div class="status-card"><h2>No job specified</h2><p>Start a new request from the create page.</p></div>`;
    return;
  }
  try {
    const job = await apiGet(`/api/jobs/${encodeURIComponent(jobId)}`);
    if (job.status !== "complete") {
      window.location.href = `/job?id=${encodeURIComponent(jobId)}`;
      return;
    }
    content.innerHTML = `
      <div class="result-preview">
        <img src="${job.preview_url}" alt="Preview render of your generated 3D model">
        <h2>Your model is ready</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px">"${escapeHtml(job.prompt || "")}"</p>
        <a href="${job.download_url}" class="btn btn-primary" style="padding:14px 32px; font-size:1.05rem">Download STL</a>
      </div>
    `;
  } catch (e) {
    content.innerHTML = `<div class="status-card"><h2>Couldn't load this result</h2><p>${escapeHtml(e.message || "")}</p></div>`;
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
