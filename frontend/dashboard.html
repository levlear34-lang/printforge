<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — PrintForge</title>
<meta name="description" content="Your PrintForge job history, saved Kaggle token, and account settings.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/style.css">
<style>
.job-row {
  display: flex;
  gap: var(--space-4);
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  box-shadow: var(--shadow-sm);
}
.job-row img {
  width: 72px;
  height: 52px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--bg-elevated);
  flex-shrink: 0;
}
.job-row .job-thumb-placeholder,
.job-row .skeleton-thumb {
  width: 72px;
  height: 52px;
  border-radius: 6px;
  background: var(--bg-elevated);
  flex-shrink: 0;
}
.job-row .job-info { flex: 1; min-width: 0; }
.job-row .job-prompt { font-size: var(--text-sm); font-weight: 500; margin: 0 0 var(--space-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-row .job-meta { font-size: var(--text-xs); color: var(--text-muted); margin: 0; display: flex; align-items: center; gap: var(--space-1); }
.job-row .job-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }
.account-card {
  background: var(--card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: var(--space-5);
  margin-bottom: var(--space-6);
  box-shadow: var(--shadow-sm);
}
.danger-zone {
  margin-top: var(--space-6);
  padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}
</style>
</head>
<body>
<nav class="nav">
  <div class="container">
    <a class="nav-logo" href="/">Print<span>Forge</span></a>
    <div class="nav-links">
      <a href="/create" class="btn btn-primary">Create your model</a>
      <a href="#" id="logout-link">Log out</a>
    </div>
  </div>
</nav>

<main>
  <section class="section">
    <div class="container">
      <h2>Dashboard</h2>
      <p class="section-sub" id="account-email"></p>

      <div class="account-card">
        <h3 style="margin-top:0">Kaggle token</h3>
        <div id="token-section"></div>
      </div>

      <h3>Your models</h3>
      <div id="jobs-list" aria-live="polite">
        <div class="job-row skeleton-row">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton-text-group">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-30"></div>
          </div>
        </div>
        <div class="job-row skeleton-row">
          <div class="skeleton skeleton-thumb"></div>
          <div class="skeleton-text-group">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-30"></div>
          </div>
        </div>
      </div>

      <div class="danger-zone">
        <button class="btn btn-secondary" id="delete-account-btn">Delete account</button>
      </div>
    </div>
  </section>
</main>

<script src="/assets/app.js"></script>
<script>
const emailEl = document.getElementById("account-email");
const tokenSection = document.getElementById("token-section");
const jobsList = document.getElementById("jobs-list");

async function init() {
  const me = await apiGet("/api/me");
  if (!me.logged_in) {
    window.location.href = "/login";
    return;
  }
  emailEl.textContent = me.email;
  renderTokenSection(me);
  loadJobs();
}

function renderTokenSection(me) {
  if (me.has_saved_token) {
    tokenSection.innerHTML = `
      <p>Saved (Kaggle account: <strong>${escapeHtml(me.saved_kaggle_username || "")}</strong>). Never shown in plain text.</p>
      <button class="btn btn-secondary" id="delete-token-btn">Delete saved token</button>
    `;
    document.getElementById("delete-token-btn").addEventListener("click", async () => {
      await fetch("/api/account/token", { method: "DELETE" });
      const me2 = await apiGet("/api/me");
      renderTokenSection(me2);
    });
  } else {
    tokenSection.innerHTML = `
      <p style="color:var(--text-muted)">No token saved. Save one so you don't have to paste it every time.</p>
      <div class="field">
        <input type="password" id="new-token-input" placeholder="Paste your Kaggle token">
      </div>
      <button class="btn btn-primary" id="save-token-btn">Save token</button>
      <div id="token-banner-slot"></div>
    `;
    document.getElementById("save-token-btn").addEventListener("click", async () => {
      const bannerSlot = document.getElementById("token-banner-slot");
      bannerSlot.innerHTML = "";
      try {
        await apiPost("/api/account/token", { kaggle_token: document.getElementById("new-token-input").value.trim() });
        const me2 = await apiGet("/api/me");
        renderTokenSection(me2);
      } catch (e) {
        bannerSlot.innerHTML = `<div class="banner banner-error">${escapeHtml(e.message || "")}</div>`;
      }
    });
  }
}

async function loadJobs() {
  try {
    const jobs = await apiGet("/api/dashboard/jobs");
    if (jobs.length === 0) {
      jobsList.innerHTML = `<p style="color:var(--text-muted)">No models yet. <a href="/create">Create your first one</a>.</p>`;
      return;
    }
    jobsList.innerHTML = jobs.map(renderJobRow).join("");
    jobs.forEach((job) => {
      const btn = document.getElementById(`delete-${job.id}`);
      if (btn) {
        btn.addEventListener("click", async () => {
          await fetch(`/api/dashboard/jobs/${job.id}`, { method: "DELETE" });
          loadJobs();
        });
      }
    });
  } catch (e) {
    jobsList.innerHTML = `<p style="color:var(--error)">${escapeHtml(e.message || "Couldn't load your models.")}</p>`;
  }
}

const STATUS_LABELS = {
  complete: "Complete",
  running: "Running",
  submitted: "Submitted",
  error: "Error",
  quality_failed: "Needs retry",
};

function renderJobRow(job) {
  const thumb = job.preview_url
    ? `<img src="${job.preview_url}" alt="Preview of ${escapeHtml(job.prompt)}">`
    : `<div class="job-thumb-placeholder"></div>`;
  const downloadBtn = job.download_url
    ? `<a href="${job.download_url}" class="btn btn-secondary">Download</a>`
    : "";
  const statusLabel = STATUS_LABELS[job.status] || job.status;
  return `
    <div class="job-row">
      ${thumb}
      <div class="job-info">
        <p class="job-prompt">${escapeHtml(job.prompt)}</p>
        <p class="job-meta">
          <span class="status-pill status-pill-${job.status}">${statusLabel}</span>
          · expires ${new Date(job.expires_at).toLocaleDateString()}
        </p>
      </div>
      <div class="job-actions">
        ${downloadBtn}
        <button class="btn btn-secondary" id="delete-${job.id}">Delete</button>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById("logout-link").addEventListener("click", async (event) => {
  event.preventDefault();
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/";
});

document.getElementById("delete-account-btn").addEventListener("click", async () => {
  if (!confirm("Delete your account? This also deletes your saved token and model history. This can't be undone.")) return;
  await fetch("/api/account", { method: "DELETE" });
  window.location.href = "/";
});

init();
</script>
</body>
</html>
